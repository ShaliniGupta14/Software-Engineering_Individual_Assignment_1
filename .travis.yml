
language: python

dist: noble

python:
  - "3.13"

install:
  - pip install -r requirements-dev.txt

before_script:
  - python manage.py check

script:
  - black --check . --exclude '/(\.git|assignment_1|migrations)/'
  - flake8 .
  - coverage run --source=mysite,polls manage.py test
  - coverage report

after_success:
  - coveralls


deploy:
  provider: elasticbeanstalk
  edge: true
  region: us-east-2
  app: Individual_Assignment_1
  env: IndividualAssignment1-env
  bucket: elasticbeanstalk-us-east-2-550097745854
  bucket_path: travis-deployments
  access_key_id: $AWS_ACCESS_KEY_ID
  secret_access_key: $AWS_SECRET_ACCESS_KEY
  on:
    branch: main
    repo: ShaliniGupta14/Software-Engineering_Individual_Assignment_1

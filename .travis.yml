language: python

dist: noble

python:
  - "3.13"

install:
  - pip install -r requirements-dev.txt
  - pip install awscli

before_script:
  - python manage.py check

script:
  - black --check . --exclude '/(\.git|assignment_1|migrations)/'
  - flake8 .
  - coverage run --source=mysite,polls manage.py test
  - coverage report

after_success:
  - coveralls

deploy:
  provider: script
  script: bash scripts/deploy_aws.sh
  on:
    branch: main
    repo: ShaliniGupta14/Software-Engineering_Individual_Assignment_1
